
name: Playwright .NET + Reqnroll CI

on:
  push:            # runs after every commit/push (all branches)
    branches: [ "**" ]
  # pull_request:
  #   branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOTNET_VERSION: "8.0.x"
      TEST_CONFIGURATION: "Release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.TEST_CONFIGURATION }} --no-restore

      # Auto-detect the generated Playwright browser installer script
      - name: Locate playwright.ps1
        id: pwsh_path
        shell: pwsh
        run: |
          $script = Get-ChildItem -Recurse -Filter 'playwright.ps1' -Path "./bin" | Select-Object -First 1
          if (-not $script) {
            Write-Host "ERROR: playwright.ps1 not found under ./bin. Ensure at least one project references Microsoft.Playwright and was built."
            exit 1
          }
          Write-Host "Playwright installer: $($script.FullName)"
          "scriptPath=$($script.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Install Playwright browsers + system deps (per official docs)
      - name: Install Playwright browsers (+deps)
        shell: pwsh
        run: pwsh "${{ steps.pwsh_path.outputs.scriptPath }}" install --with-deps

      # Run tests (Reqnroll scenarios execute via dotnet test)
      - name: Test
        run: |
          dotnet test --configuration ${{ env.TEST_CONFIGURATION }} --no-build \
            --logger "trx;LogFileName=TestResults.trx" \
            --verbosity normal

      # Upload test result logs (TRX)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults.trx"

      # Optional: upload Playwright traces/videos/screenshots if you record them
      - name: Upload Playwright artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            **/playwright-report/**
            **/test-results/**
            **/*.zip
          if-no-files-found: ignore
