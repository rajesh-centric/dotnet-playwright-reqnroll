name: Playwright .NET + Reqnroll CI
 
on:
  push:
 
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
 
    env:
      DOTNET_VERSION: "8.0.x"
      TEST_CONFIGURATION: "Release"
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: Restore
        run: dotnet restore
 
      - name: Identify Playwright test project
        id: identify_proj
        shell: pwsh
        run: |
          $proj = $null
 
          foreach ($file in Get-ChildItem -Recurse -Filter *.csproj) {
            [xml]$xml = Get-Content $file.FullName
            if ($xml.Project.ItemGroup.PackageReference |
                Where-Object { $_.Include -eq "Microsoft.Playwright" }) {
              $proj = $file
              break
            }
          }
 
          if (-not $proj) {
            Write-Error "No Playwright project found"
            exit 1
          }
 
          "projPath=$($proj.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Using Playwright project: $($proj.FullName)"
 
      - name: Build Playwright test project
        run: |
          dotnet build "${{ steps.identify_proj.outputs.projPath }}" \
            --configuration ${{ env.TEST_CONFIGURATION }} \
            --no-restore
 
      # ✅ CORRECT WAY TO INSTALL PLAYWRIGHT BROWSERS
      - name: Install Playwright browsers
        run: |
          dotnet tool restore
          dotnet tool run playwright install --with-deps
 
      - name: Run tests (Reqnroll)
        run: |
          dotnet test "${{ steps.identify_proj.outputs.projPath }}" \
            --configuration ${{ env.TEST_CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=TestResults.trx"
 
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults.trx"
 
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore
